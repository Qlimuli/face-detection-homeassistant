# Service definitions for Local Face Secure
# These are used by Home Assistant to generate the UI for services

teach_face:
  name: Teach Face
  description: >-
    Capture a snapshot from a camera and learn a face. 
    The image must contain exactly one face.
  fields:
    entity_id:
      name: Camera
      description: The camera entity to capture the snapshot from.
      required: true
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    name:
      name: Name
      description: The name to associate with this face (e.g., person's name).
      required: true
      example: "Stefan"
      selector:
        text:

scan_match:
  name: Scan & Match
  description: >-
    Capture a snapshot from a camera and compare detected faces against 
    all stored face encodings. Fires a local_face_secure.recognized event 
    for each matched face.
  fields:
    entity_id:
      name: Camera
      description: The camera entity to capture the snapshot from.
      required: true
      example: "camera.front_door"
      selector:
        entity:
          domain: camera

delete_face:
  name: Delete Face
  description: Remove a stored face encoding by name.
  fields:
    name:
      name: Name
      description: The name of the face to delete.
      required: true
      example: "Stefan"
      selector:
        text:

list_faces:
  name: List Faces
  description: Get a list of all stored face names.
