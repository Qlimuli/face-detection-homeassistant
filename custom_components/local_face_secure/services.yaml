teach_face:
  name: Teach Face
  description: Capture a face from camera and add it to the known faces database.
  fields:
    entity_id:
      name: Camera Entity
      description: The camera entity to capture the face from.
      required: true
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    name:
      name: Person Name
      description: The name to associate with this face.
      required: true
      example: "Stefan"
      selector:
        text:

scan_match:
  name: Scan and Match
  description: Capture a face from camera and attempt to match it against known faces.
  fields:
    entity_id:
      name: Camera Entity
      description: The camera entity to capture the face from.
      required: true
      example: "camera.front_door"
      selector:
        entity:
          domain: camera

delete_face:
  name: Delete Face
  description: Remove a face from the known faces database.
  fields:
    name:
      name: Person Name
      description: The name of the face to delete.
      required: true
      example: "Stefan"
      selector:
        text:

list_faces:
  name: List Faces
  description: Get a list of all known face names in the database.
