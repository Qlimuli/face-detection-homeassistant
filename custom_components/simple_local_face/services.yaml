train_face:
  name: Train Face
  description: Train a new face from an image file or camera snapshot
  fields:
    person_name:
      name: Person Name
      description: Name of the person to train
      required: true
      example: "John Doe"
      selector:
        text:
    image_path:
      name: Image Path
      description: Path to an image file
      required: false
      example: "/config/www/faces/john.jpg"
      selector:
        text:
    camera_entity:
      name: Camera Entity
      description: Camera entity to take a snapshot from
      required: false
      example: "camera.front_door"
      selector:
        entity:
          domain: camera

remove_face:
  name: Remove Face
  description: Remove all trained data for a person
  fields:
    person_name:
      name: Person Name
      description: Name of the person to remove
      required: true
      example: "John Doe"
      selector:
        text:

list_faces:
  name: List Faces
  description: List all trained faces and their encoding counts
