# Service definitions for Local Face Secure

teach_face:
  name: Teach Face
  description: Capture a face from camera and learn it with a given name.
  fields:
    entity_id:
      name: Camera Entity
      description: The camera entity to capture from.
      required: true
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    name:
      name: Person Name
      description: The name to associate with this face.
      required: true
      example: "Stefan"
      selector:
        text:

scan_match:
  name: Scan and Match
  description: Scan camera for a face and match against known faces.
  fields:
    entity_id:
      name: Camera Entity
      description: The camera entity to scan.
      required: true
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    tolerance:
      name: Match Tolerance
      description: How strict the matching should be (lower = stricter, default 0.6).
      required: false
      default: 0.6
      example: 0.5
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.05
          mode: slider

delete_face:
  name: Delete Face
  description: Remove a learned face from the database.
  fields:
    name:
      name: Person Name
      description: The name of the face to delete.
      required: true
      example: "Stefan"
      selector:
        text:

list_faces:
  name: List Faces
  description: List all known faces in the database.
